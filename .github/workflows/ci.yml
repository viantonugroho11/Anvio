name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build-typecheck:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Node 20 reached end-of-life on 2026-04-30; Slack/Discord adapters also rely
    # on the global WebSocket, which is unflagged only from Node 22.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      ANTHROPIC_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Critical only for now: zod 3 (used by @anvio/core schemas) carries a
      # high-severity advisory fixed only in zod 4 — see
      # docs/audits/code-quality/remediation/05-remaining-issues.md. Raise to
      # `high` once that migration lands.
      - run: pnpm audit --prod --audit-level=critical

  all-green:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, build-typecheck, test, audit]
    steps:
      - run: echo "CI passed"
